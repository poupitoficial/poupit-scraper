name: Matching entre lojas

on:
  schedule:
    # 09:00 UTC, depois do scrape.yml (04:00 UTC, ate 4h de folga) terminar = 09:00
    # em Portugal no inverno, 10:00 no horario de verao (DST). Janela alargada porque
    # o scrape agora cobre 4 lojas (Continente/Pingo Doce/Lidl/Auchan), nao so o
    # Continente — o Pingo Doce sozinho busca pagina a pagina (~9600 produtos,
    # ~350ms cada) e pode demorar mais de 1h.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # matchAll.mjs exporta o estado atual de cada loja diretamente da BD
      # (scripts/exportFromSupabase.mjs) e corre os 6 pares possiveis entre
      # continente/pingo-doce/lidl/auchan, gravando analysis/matches_*.json.
      - run: node scripts/matchAll.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Insere matches de alta confianca (score>=0.75) em matched_products,
      # e os de baixa confianca em matched_products_review. Precisa das
      # migrations supabase/003, 004 e 007 (ja no repo, por correr na BD).
      - run: node scripts/insertMatchesAll.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
